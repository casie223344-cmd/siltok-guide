ads/windows/032.bin", "url": "https://siltok-guide-oct21.famousmule4.chatgpt.site/downloads/windows/032.bin", "sha256": "838edd41856030e6002e26c938375ffc8eda825f9b8558a690f870e1da5d31b6"}, {"path": "downloads/windows/033.bin", "url": "https://siltok-guide-oct21.famousmule4.chatgpt.site/downloads/windows/033.bin", "sha256": "4a1e666747acd30163fea44973fe99d0f31bc1bc618fd8a32356813c703c2e3f"}, {"path": "downloads/windows/034.bin", "url": "https://siltok-guide-oct21.famousmule4.chatgpt.site/downloads/windows/034.bin", "sha256": "09f958a87797fd3115d088e17c08df1637b978af0407ed253b609bc28ee152c8"}]')
              from pathlib import Path
              from concurrent.futures import ThreadPoolExecutor
              from urllib.request import urlopen, Request
              from urllib.parse import quote
              import json,hashlib,time
              root=Path('site')
              def retrieve(item):
                  path=root/item['path']
                  if path.exists() and hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']:return
                  for attempt in range(4):
                      try:
                          with urlopen(Request(quote(item['url'],safe=':/'),headers={'User-Agent':'Siltok website migration'}),timeout=90) as response:data=response.read()
                          assert hashlib.sha256(data).hexdigest()==item['sha256'],item['path']
                          path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data);return
                      except Exception:
                          if attempt==3:raise
                          time.sleep(2**attempt)
              with ThreadPoolExecutor(max_workers=4) as pool:list(pool.map(retrieve,json.loads(Path('migration-files.json').read_text())))
              for name,entry in json.loads((root/'downloads/manifest.json').read_text()).items():
                  sha=hashlib.sha256();size=0
                  for chunk in entry['chunks']:
                      data=(root/chunk).read_bytes();sha.update(data);size+=len(data)
                  assert sha.hexdigest()==entry['sha256'] and size==entry['bytes'],name
                  print(name,'verified')
              (root/'.nojekyll').touch()
